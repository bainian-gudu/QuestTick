# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# AGP 9 built-in Kotlin currently conflicts with KSP generated source registration for benchmark/release variants.
# Keep the compatibility bridge enabled until KSP/AGP can register these generated sources through android.sourceSets.
android.disallowKotlinSourceSets=true
android.enableR8.fullMode=true
