name: Unit Tests

on:
  push:
    branches: [main, master]
    paths:
      - '**.kt'
      - '**.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/proguard-rules.pro'
      - 'app/schemas/**'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/proguard-rules.pro'
      - 'app/schemas/**'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 单元测试与覆盖率报告放在同一次 Gradle 调用里：
      # 分两次调用会各自 fork 一个 single-use daemon（日志里的 "a single-use Daemon process will be forked"），
      # 白白多付一次 JVM 启动与配置阶段开销，还会重复输出一遍构建产物路径。
      - name: Run unit tests and generate Kover coverage report
        run: ./gradlew :app:testDebugUnitTest :app:koverXmlReportDebug :app:koverHtmlReportDebug --no-daemon --stacktrace

      - name: Enforce core business coverage >= 70%
        run: python3 scripts/check_kover_coverage.py

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-report
          path: app/build/reports/kover
          retention-days: 14
