name: Unit Tests

on:
  push:
    branches: [main, master]
    paths:
      - '**.kt'
      - '**.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/proguard-rules.pro'
      - 'app/schemas/**'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/proguard-rules.pro'
      - 'app/schemas/**'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # TODO(temp): 诊断脚手架——失败时把 Gradle 日志尾部以 annotations 形式发布，
      # 便于无法访问 Actions 日志流时通过 GitHub API（jobs.annotations）读取错误。
      # 定位问题后请移除本步骤，恢复为单行命令：
      #   run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Run unit tests
        run: |
          set -o pipefail
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-unit-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error:: unit-test step failed (exit=${code}); publishing last 150 log lines as annotations"
            java -version 2>&1 | sed 's/^/::error:: [env] /'
            tail -n 150 /tmp/gradle-unit-test.log 2>/dev/null | sed 's/^/::error:: [gradle] /'
          fi
          exit "$code"

      - name: Generate Kover coverage report
        run: ./gradlew :app:koverXmlReportDebug :app:koverHtmlReportDebug --no-daemon --stacktrace

      - name: Enforce core business coverage >= 70%
        run: python3 scripts/check_kover_coverage.py

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-report
          path: app/build/reports/kover
          retention-days: 14
