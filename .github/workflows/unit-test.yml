name: Unit Tests

on:
  push:
    branches: [main, master]
    paths:
      - '**.kt'
      - '**.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/proguard-rules.pro'
      - 'app/schemas/**'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/proguard-rules.pro'
      - 'app/schemas/**'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # TODO(temp): 诊断脚手架——失败时把关键错误段合并为单条 annotation 消息发布
      # （GitHub 对逐行 annotation 有数量截断，合并成一条消息可完整保留），
      # 便于无法访问 Actions 日志流时通过 GitHub API 读取错误。
      # 定位问题后请移除本步骤，恢复为单行命令：
      #   run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Run unit tests
        run: |
          set -o pipefail
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-unit-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 把多行文本合并为单条 annotation 消息（% 转义 + 换行编码为 %0A）
            emit_block() {
              awk -v tag="$1" '
                { s = $0; gsub(/%/, "%%", s); if (NR > 1) buf = buf "%0A"; buf = buf s }
                END { if (buf != "") print "::error:: [" tag "] " buf }
              '
            }
            grep -E "^e: |error: " /tmp/gradle-unit-test.log 2>/dev/null | head -n 25 | emit_block "kotlin-errors"
            awk '/^FAILURE:/{f=1} f{print} /^BUILD FAILED/{if (f) exit}' /tmp/gradle-unit-test.log 2>/dev/null \
              | head -n 40 | emit_block "failure-section"
            tail -n 15 /tmp/gradle-unit-test.log 2>/dev/null | emit_block "raw-tail"
          fi
          exit "$code"

      - name: Generate Kover coverage report
        run: ./gradlew :app:koverXmlReportDebug :app:koverHtmlReportDebug --no-daemon --stacktrace

      - name: Enforce core business coverage >= 70%
        run: python3 scripts/check_kover_coverage.py

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-report
          path: app/build/reports/kover
          retention-days: 14
