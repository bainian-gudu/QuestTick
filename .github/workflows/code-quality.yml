name: Code Quality

on:
  workflow_dispatch:
  # 不再在 push / pull_request 时自动运行（需手动触发）

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare reports directory
        run: mkdir -p build/reports

      - name: Run ktlint
        run: |
          set -euo pipefail
          curl -L -o /tmp/ktlint.jar https://repo1.maven.org/maven2/com/pinterest/ktlint/ktlint-cli/1.8.0/ktlint-cli-1.8.0-all.jar
          java -jar /tmp/ktlint.jar \
            "**/*.kt" "**/*.kts" \
            "!**/build/**" "!**/.gradle/**" "!**/.kotlin/**" \
            --reporter=plain | tee build/reports/ktlint.txt

      - name: Run detekt
        run: |
          set -euo pipefail
          curl -L -o /tmp/detekt.jar https://repo1.maven.org/maven2/io/gitlab/arturbosch/detekt/detekt-cli/1.23.8/detekt-cli-1.23.8-all.jar
          java -jar /tmp/detekt.jar \
            --input app/src/main/java,app/src/test/java,baselineprofile/src/main/java \
            --report txt:build/reports/detekt.txt \
            --report html:build/reports/detekt.html

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: build/reports
          retention-days: 7
