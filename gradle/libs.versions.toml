# 依赖与插件版本目录：构建脚本中不再硬编码版本号。
[versions]
ktlint = "1.5.0"
# kotlinx-coroutines 运行时与测试库必须同版本，避免测试 classpath 中
# core 被传递依赖提升后与 -test 库版本不一致。
coroutines = "1.11.0"

[libraries]
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version = "9.2.1" }
android-test = { id = "com.android.test", version = "9.2.1" }
baselineprofile = { id = "androidx.baselineprofile", version = "1.5.0-alpha05" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version = "2.4.0" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.9" }
hilt = { id = "com.google.dagger.hilt.android", version = "2.59.2" }
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.8" }
spotless = { id = "com.diffplug.spotless", version = "7.0.4" }
detekt = { id = "io.gitlab.arturbosch.detekt", version = "1.23.8" }
